<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Maroc Bridges</title>
<meta name="description" content="Het roadtrip-avontuur door Marokko: van Marrakech over de Hoge Atlas naar de Sahara en terug.">
<meta name="theme-color" content="#2a160c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maroc Bridges">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="game.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels" hidden></div>

<!-- INTRO -->
<section id="intro" class="screen">
  <div class="logo" id="logo" aria-label="Maroc Bridges">
    <svg class="star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 2l11.5 22.2L85.4 14.6 75.8 38.5 98 50 75.8 61.5 85.4 85.4 61.5 75.8 50 98 38.5 75.8 14.6 85.4 24.2 61.5 2 50 24.2 38.5 14.6 14.6 38.5 24.2z"/></svg>
    <div class="l1" data-word="MAROC"></div>
    <div class="l2" data-word="BRIDGES"></div>
    <p class="tag">Het roadtrip-avontuur door Marokko</p>
  </div>
  <p class="skip" id="skip">Tik om verder te gaan</p>
</section>

<!-- WORLD MAP HUD -->
<section id="hud" class="screen" hidden>
  <header class="hud-top">
    <div class="mini-logo"><b>MAROC</b> <i>BRIDGES</i></div>
    <p class="hud-sub">7 nachten · 5 bestemmingen</p>
  </header>
  <footer class="hud-bottom">
    <p class="hint" id="hint">Tik op een bestemming, of…</p>
    <button class="btn big" id="start"><span>START</span></button>
  </footer>
</section>

<!-- DRIVE / FLIGHT BANNER -->
<div id="banner" hidden><small></small><b></b><span></span></div>

<!-- LOCATION -->
<section id="loc" hidden>
  <div id="locmap"></div>
  <header class="loc-top">
    <button class="round" id="toMap" aria-label="Terug naar de kaart">
      <svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5zM9 6.3v11.4M15 8.7v11.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
    <div class="chip" id="chip"><img alt=""><div><small></small><b></b></div></div>
  </header>
  <footer class="loc-bottom">
    <button class="btn teal" id="explore"><span>Onderzoek de omgeving</span></button>
    <button class="btn" id="next"><span>Op naar de volgende locatie</span><small></small></button>
  </footer>
  <div id="card" hidden>
    <div class="card-in">
      <button class="x" id="cardX" aria-label="Sluiten">✕</button>
      <figure class="gal-wrap"><div class="gal" id="gal"></div><div class="dots" id="dots"></div></figure>
      <p class="credit" id="credit"></p>
      <div class="card-body" id="cardBody"></div>
    </div>
  </div>
</section>

<!-- END -->
<section id="end" class="screen" hidden>
  <div class="end-card">
    <div class="stars"><i>★</i><i>★</i><i>★</i></div>
    <h2>Reis voltooid!</h2>
    <p>7 nachten · 5 bestemmingen · ±1.180 km door Marokko</p>
    <p class="shukran">Shukran &amp; tot de volgende reis</p>
    <button class="btn" id="again"><span>Opnieuw spelen</span></button>
    <button class="link" id="endMap">Terug naar de kaart</button>
  </div>
</section>

<div id="confetti"></div>
<div id="iris"></div>
<div id="loading"><div class="spin"></div></div>

<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
<script type="module" src="game.js"></script>
</body>
</html>
