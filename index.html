/* Layout: full-screen map; one glass sheet (bottom on phones, floating left column on desktop) carries the journey. */
:root{
  color-scheme: light;
  --bg:#F5F4F2; --glass:rgba(255,255,255,.84); --solid:#FFFFFF; --ink:#141416; --ink-2:#3C3C43; --muted:#8A8A90;
  --sep:rgba(60,60,67,.13); --fill:rgba(118,118,128,.12); --card:#FFFFFF;
  --accent:#2C47D6; --see:#2C47D6; --eat:#D9741F; --stay:#141416; --road:#0F8A7E;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --shadow:0 10px 30px -12px rgba(20,20,22,.28), 0 2px 6px rgba(20,20,22,.06);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-display:"Instrument Serif","New York","Iowan Old Style",Georgia,serif;
  --f-ar:"Noto Naskh Arabic","Geeza Pro",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:-.005em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

/* map */
#map{position:fixed;inset:0;background:#EEEAE3}
#map .maplibregl-canvas{filter:saturate(.72) brightness(1.02)}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{bottom:var(--sheet-h,0px);transition:bottom .35s cubic-bezier(.2,.8,.2,1)}
.maplibregl-ctrl-scale{background:rgba(255,255,255,.7);border-color:var(--ink-2);color:var(--ink-2);font:500 10px/1.4 var(--f-ui)}
.maplibregl-ctrl-attrib{font:400 10px/1.4 var(--f-ui)}

/* top brand + controls */
.topbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);padding:9px 16px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--shadow);font:600 11px/1 var(--f-ui);letter-spacing:.34em;text-indent:.34em;white-space:nowrap;pointer-events:none}
.ctrls{position:fixed;z-index:30;right:12px;top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;flex-direction:column;gap:10px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;border-radius:var(--r-md);overflow:hidden}
.stack button{width:44px;height:44px;display:grid;place-items:center}
.stack button+button{border-top:1px solid var(--sep)}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
#sheet{position:fixed;z-index:20;left:0;right:0;bottom:0;height:56%;display:flex;flex-direction:column;background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -12px 40px -16px rgba(20,20,22,.3);transition:height .38s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.dragging{transition:none}
.grab{flex:none;height:22px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab span{width:38px;height:5px;border-radius:3px;background:rgba(60,60,67,.3)}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-inline:16px;padding-block:2px 32px;-webkit-overflow-scrolling:touch}

/* type */
.large{padding:2px 4px 10px}
.large h1{margin:0;font:400 38px/1.02 var(--f-display);letter-spacing:-.01em}
.large p{margin:6px 0 0;color:var(--muted);font-size:14px}
.kicker{margin:0;color:var(--muted);font:600 11px/1.2 var(--f-ui);letter-spacing:.14em;text-transform:uppercase}
.sect{margin:22px 4px 10px;font:600 13px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
.stat{background:var(--card);border-radius:var(--r-md);padding:10px 10px 9px}
.stat b{display:block;font:600 17px/1.15 var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--muted)}

/* carousel */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.card{position:relative;flex:none;width:min(66vw,250px);aspect-ratio:4/5;border-radius:var(--r-lg);overflow:hidden;scroll-snap-align:start;box-shadow:var(--shadow);background:#ddd}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover img{transform:scale(1.04)}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.62))}
.card .num{position:absolute;top:12px;left:12px;font:600 11px/1 var(--f-ui);letter-spacing:.12em;color:#fff;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:6px 9px;border-radius:999px;text-transform:uppercase}
.card .ct{position:absolute;left:14px;right:14px;bottom:14px;color:#fff}
.card .ct b{display:block;font:400 30px/1 var(--f-display)}
.card .ct span{font-size:12.5px;opacity:.9}

/* grouped list */
.group{list-style:none;margin:0;padding:0;background:var(--card);border-radius:var(--r-md);overflow:hidden}
.row{width:100%;display:grid;grid-template-columns:56px 1fr 14px;gap:12px;align-items:center;padding:10px 14px 10px 10px;position:relative}
.group li+li .row::before{content:"";position:absolute;top:0;left:78px;right:0;height:1px;background:var(--sep)}
.row:active{background:rgba(0,0,0,.04)}
.thumb{position:relative;width:56px;height:56px;border-radius:var(--r-sm);overflow:hidden;background:#e7e5e1}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb i{position:absolute;right:3px;bottom:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:grid;place-items:center;font:600 10.5px/1 var(--f-ui);font-style:normal;color:#fff;box-shadow:0 0 0 2px #fff}
.rt{min-width:0}
.rt b{display:block;font:600 15.5px/1.25 var(--f-ui);letter-spacing:-.01em}
.rt span{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rt em{font-style:normal;color:var(--ink-2);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.chev{width:9px;height:14px;stroke:rgba(60,60,67,.3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.c-see{background:var(--see)} .c-eat{background:var(--eat)} .c-stay{background:var(--stay)} .c-road{background:var(--road)}

/* destination */
.nav{display:flex;align-items:center;justify-content:space-between;margin:0 -4px 8px}
.back{display:flex;align-items:center;gap:4px;color:var(--accent);font:500 16px/1 var(--f-ui);padding:6px 4px}
.back svg{width:11px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hero{position:relative;margin:0;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/10;background:#ddd;box-shadow:var(--shadow)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.55))}
.hero .ht{position:absolute;left:16px;right:16px;bottom:14px;color:#fff}
.hero .ht .kicker{color:rgba(255,255,255,.85)}
.hero .ht h1{margin:4px 0 0;font:400 36px/1 var(--f-display)}
.hero .ht .ar{display:block;margin-top:6px;font:500 15px/1.2 var(--f-ar);opacity:.9}
.credit{margin:6px 6px 0;font-size:10.5px;color:var(--muted)}
.credit a{text-decoration:none;border-bottom:1px solid var(--sep)}
.lede{margin:14px 4px 4px;font:400 20px/1.35 var(--f-display);color:var(--ink-2)}
.seg{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px;margin:16px 0 12px;border-radius:9px;background:rgba(236,236,240,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.seg button{border-radius:7px;padding:7px 2px;text-align:center;font:500 13px/1.1 var(--f-ui);color:var(--ink-2);display:flex;gap:6px;align-items:center;justify-content:center}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.note{margin:10px 4px;color:var(--muted);font-size:13px}

/* detail */
.dhero{position:relative;margin:0;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:3/2;background:#ddd;box-shadow:var(--shadow)}
.gal{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;height:100%;object-fit:cover;display:block;scroll-snap-align:center}
.gdots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.gdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 3px rgba(0,0,0,.3)}
.gdots i.on{background:#fff}
.xbtn{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 2px 10px rgba(0,0,0,.18);color:var(--ink)}
.xbtn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.dt{padding:14px 4px 4px}
.dt h1{margin:4px 0 8px;font:400 34px/1.04 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11px/1 var(--f-ui);padding:6px 9px;border-radius:999px;background:var(--fill);color:var(--ink-2)}
.chip.hot{background:rgba(217,116,31,.13);color:#A9530F}
.chip.gem{background:rgba(44,71,214,.11);color:var(--accent)}
.prose{margin:12px 4px 16px;font-size:16px;line-height:1.55;color:var(--ink-2);max-width:40em}
.info{list-style:none;margin:0 0 16px;padding:0;background:var(--card);border-radius:var(--r-md);overflow:hidden}
.info li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 14px}
.info li+li{border-top:1px solid var(--sep)}
.info .ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff}
.info .ib svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.info b{display:block;font:600 13px/1.2 var(--f-ui);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.info p{margin:0;font-size:15px;line-height:1.45}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font:600 15px/1 var(--f-ui);padding:14px 12px;border-radius:var(--r-md);background:var(--card);color:var(--accent)}
.btn.primary{background:var(--ink);color:#fff}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{margin:22px 6px 0;font-size:11.5px;color:var(--muted);line-height:1.5}

/* pins */
.mk{width:0;height:0}
.maplibregl-marker:has(.on){z-index:3}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:grid;place-items:center;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.pin .m{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font:600 12px/1 var(--f-ui);font-variant-numeric:tabular-nums;box-shadow:0 0 0 2.5px #fff,0 4px 10px rgba(0,0,0,.28)}
.pin .m svg{width:14px;height:14px;fill:#fff}
.pin-road .m{width:22px;height:22px;font-size:10.5px}
.pin-dest .m{width:42px;height:42px;background:#ccc center/cover;box-shadow:0 0 0 3px #fff,0 8px 18px rgba(0,0,0,.32)}
.pin-dest .n{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:600 11px/1 var(--f-ui);box-shadow:0 0 0 2px #fff}
.pin .lbl{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.14);font:600 12px/1.2 var(--f-ui);pointer-events:none}
.pin-dest .lbl{font:400 15px/1.1 var(--f-display);padding:3px 10px}
.pin-dest.lb-l .lbl{top:50%;left:auto;right:calc(100% + 8px);transform:translateY(-50%)}
.pin-dest.lb-t .lbl{top:auto;bottom:calc(100% + 8px)}
.pin-dest.lb-r .lbl{top:50%;left:calc(100% + 8px);transform:translateY(-50%)}
.pin-see .lbl,.pin-eat .lbl,.pin-road .lbl{display:none}
.pin.on{transform:translate(-50%,-50%) scale(1.22)}
.pin.on .lbl{display:block}
#map.vfar .pin-road .m{width:12px;height:12px;font-size:0;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.25)}
#map.far .pin-see,#map.far .pin-eat,#map.far .pin-stay{display:none}
#map.far .pin.on{display:grid}
#map:not(.far) .pin-dest{display:none}

@media (min-width:880px){
  #sheet{left:16px;right:auto;top:16px;bottom:16px;width:410px;height:auto!important;border-radius:var(--r-lg);box-shadow:var(--shadow)}
  .grab{display:none}
  .body{padding-top:16px}
  .topbar{left:auto;right:76px;transform:none;top:18px}
  .ctrls{top:16px;right:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const DEST = [
{ id:"marrakech", img:"d_marrakech", n:1, r:5, side:"t", name:"Marrakech", ar:"مراكش", nights:"Nights 1–2", area:"Marrakech medina",
  lede:"Two nights is enough for the medina if you work with the light: palaces at opening time, souks in late-morning shade, rooftops at sunset.",
  stay:{ name:"Riad Imilchil", img:"s_marrakech", gallery:["s_marrakech","s_marrakech_2","s_marrakech_3"], lat:31.6200, lng:-7.9802, approx:true, tags:["Your stay","8 rooms"],
    blurb:"A small riad in the quieter southern half of the medina, a few lanes from Bahia Palace. Rooms mix Moroccan craft with clean contemporary lines, there is a little indoor plunge pool, and breakfast is served on the roof terrace. Jemaa el-Fnaa is about 15 minutes on foot.",
    when:"Breakfast on the roof terrace, 7:00–10:00.",
    tip:"Ask the hosts to walk you back the first evening. The derbs around Jnane Ben Chegra all look alike after dark.",
    q:"Riad Imilchil Marrakech" },
  see:[
    { name:"Bahia Palace", img:"m_bahia", lat:31.62163, lng:-7.98194, tags:["Iconic"], when:"Be at the gate for opening; you are five minutes away.",
      blurb:"A 19th-century vizier's palace of painted cedar ceilings, zellige floors and carved stucco around marble courtyards. The ceilings are the reason to come; by 11:00 the rooms are shoulder to shoulder.",
      tip:"Walk straight through to the Grand Courtyard while it's empty, then work backwards through the smaller rooms." },
    { name:"El Badi Palace", img:"m_badi", gallery:["m_badi","m_badi_2","m_badi_3"], gcaps:["The sunken gardens, with the Atlas behind", "The inner chambers and their zellige floors", "Digital reconstruction of the palace as it once looked"], lat:31.61818, lng:-7.98649, tags:["Hidden gem"], when:"Late afternoon, when the walls turn copper.",
      blurb:"The shell of a 16th-century Saadian palace: sunken orange gardens, vast pools and storks nesting on the ramparts. Most visitors skip the stairs; the upper terrace gives you the whole Kasbah quarter and the Atlas.",
      tip:"Climb to the rampart terrace in the north-east corner for the storks at eye level." },
    { name:"Mellah spice market", img:"m_mellah", lat:31.62005, lng:-7.98607, tags:["Hidden gem","Near the riad"], when:"Morning, as the stalls open.",
      blurb:"The old Jewish quarter next to your riad. Quieter lanes, pyramids of spices, and the Lazama synagogue with its blue-and-white courtyard. It shows a Marrakech the main souks have lost.",
      tip:"Go with a light scarf: the synagogue asks visitors to cover their heads." },
    { name:"Le Jardin Secret", img:"m_secret", gallery:["m_secret","m_secret_2"], gcaps:["The Islamic garden and its green-tiled pavilion","The zellige fountain courtyard"], lat:31.63088, lng:-7.99005, tags:["TikTok favourite"], when:"Mid-afternoon; climb the tower before sunset.",
      blurb:"A restored riad garden in the Mouassine quarter with an exotic garden and a classic Islamic one. Its centuries-old gravity-fed water channels run again. The tower gives one of the best views over the medina roofs.",
      tip:"The tower ticket is separate. Buy it; the view is the point." },
    { name:"Ben Youssef Madrasa", img:"m_benyoussef", gallery:["m_benyoussef","m_benyoussef_2"], gcaps:["The courtyard and its reflecting pool","Framed through the carved stucco arch"], lat:31.63199, lng:-7.98604, tags:["Iconic"], when:"At opening, for the empty courtyard and still pool.",
      blurb:"Morocco's largest madrasa, once home to hundreds of students in 132 tiny cells around a courtyard of cedar, stucco and zellige. The reflecting pool gives the perfect symmetrical shot.",
      tip:"Go upstairs to the student cells: their small windows frame the courtyard like a picture." },
    { name:"Dar el Bacha", img:"m_bacha", lat:31.63139, lng:-7.99236, tags:["TikTok favourite"], when:"Opening time, before the café queue builds.",
      blurb:"The palace built for Thami El Glaoui, Pasha of Marrakech, now the Musée des Confluences. Same Glaoui family whose mountain kasbah you see at Telouet on day 3. Fountains, painted doors and the famous Bacha Coffee house inside.",
      tip:"Check opening days before you go; the museum closes one day a week." },
    { name:"Jardin Majorelle & YSL Museum", img:"m_majorelle", lat:31.64148, lng:-8.00291, tags:["Iconic","Book ahead"], when:"First timed slot of the day.",
      blurb:"Painter Jacques Majorelle's cobalt-blue studio and cactus garden, saved by Yves Saint Laurent and Pierre Bergé. Next door, the YSL museum's brick façade, laid like woven fabric, is the architectural surprise.",
      tip:"Tickets are timed and sell out. Book online the evening before." }
  ],
  eat:[
    { name:"Nomad", img:"r_nomad", cap:"Place des Épices, below the terrace", lat:31.62868, lng:-7.98744, tags:["Sunset","Book ahead"], when:"Sunset table on the top terrace.",
      blurb:"Modern Moroccan on a multi-level rooftop above Place des Épices, with the medina roofs and the Atlas behind. Light, clean cooking; the most sought-after rooftop in the old city.",
      tip:"Book the top level, not the middle terrace." },
    { name:"Le Jardin", img:"r_jardin", cap:"The courtyard garden at dusk", lat:31.63205, lng:-7.98877, tags:["Lunch","Hidden gem"], when:"Lunch, as a pause in the souks.",
      blurb:"A green-tiled riad courtyard under banana trees and palms, hidden behind a plain door in Souk Jeld Sidi Abdelaziz. One of the prettiest courtyards in the medina.",
      tip:"Ask for a table on the ground floor by the fountain." },
    { name:"Bacha Coffee", img:"r_bacha", lat:31.63152, lng:-7.99256, tags:["TikTok favourite"], when:"Late morning, after the museum.",
      blurb:"A 1910s coffee room inside Dar el Bacha: brass, painted ceilings and a menu of more than a hundred coffees served in silver pots.",
      tip:"Your museum ticket gets you in; the queue is for tables, so arrive early." },
    { name:"El Fenn rooftop", img:"r_fenn", lat:31.62728, lng:-7.99292, tags:["Sunset","Drinks"], when:"Cocktails at sunset, then dinner.",
      blurb:"The rooftop of El Fenn, one of the medina's most stylish riad hotels, looking straight at the Koutoubia. Mediterranean dishes built on Moroccan produce.",
      tip:"Reserve, even for drinks. Non-residents are welcome with a booking." },
    { name:"Kasbah Café", img:"r_kasbahcafe", cap:"The entrance, opposite the Saadian Tombs", lat:31.61713, lng:-7.98951, tags:["Lunch","View"], when:"Lunch after El Badi.",
      blurb:"Simple food, but the terrace looks over the Saadian Tombs and the Kasbah mosque minaret. An easy, honest stop in the south of the medina.",
      tip:"Go up to the top terrace; the ground floor has no view." }
  ],
  local:[{t:"Jemaa el-Fnaa",lat:31.6258,lng:-7.9891},{t:"Koutoubia",lat:31.6237,lng:-7.9970},{t:"Medina",lat:31.6355,lng:-7.9800},{t:"Gueliz",lat:31.6370,lng:-8.0130}]
},
{ id:"aitbenhaddou", img:"d_ait", n:2, r:2, side:"l", name:"Aït Benhaddou", ar:"آيت بن حدو", nights:"Night 3", area:"Ait Benhaddou",
  lede:"Day-trippers fill the ksar from 10:00 to 16:00. Sleeping across the river gives you the two hours that matter: last light on the walls, and the empty lanes at dawn.",
  stay:{ name:"Dar Mouna", img:"s_ait", lat:31.04368, lng:-7.12954, tags:["Your stay","Ksar view"],
    blurb:"A family house built in the 1940s by the current owner's father, 200 m from the ksar gate on the opposite bank. Every room looks at the ksar or the pool. The pool is fed by spring water, there's a wood-fired hammam, and vegetables come from the garden.",
    when:"Sunset from the terrace, with the ksar straight ahead.",
    tip:"Book the cooking class for your arrival afternoon, then take tea on the terrace as the ksar lights up.",
    q:"Dar Mouna Ait Benhaddou" },
  see:[
    { name:"Ksar Aït Benhaddou", img:"a_ksar", lat:31.0466, lng:-7.1300, tags:["Iconic","UNESCO"], when:"7:00, before the coaches.",
      blurb:"A fortified earthen village on the old caravan road between the Sahara and Marrakech, on the UNESCO list since 1987. You will know it from Gladiator and Game of Thrones. A few families still live inside.",
      tip:"Cross at first light. If a family invites you into their house, a small tip is customary and the view from their roof is worth it." },
    { name:"The granary at the summit", img:"a_granary", lat:31.0478, lng:-7.1305, approx:true, tags:["Sunset"], when:"The last hour before sunset.",
      blurb:"The collective granary (agadir) crowns the hill. From the top you see the whole Ounila valley, the river bend and the snow line of the High Atlas on clear days.",
      tip:"Start climbing 45 minutes before sunset; the path is steep and uneven." },
    { name:"The river crossing", img:"a_river", lat:31.0464, lng:-7.1312, approx:true, tags:["TikTok favourite"], when:"Dawn, when the water is still.",
      blurb:"The stepping stones across the Ounila riverbed give the classic reflection shot of the ksar. Depends on the season: some months it's a dry bed, some months a real river.",
      tip:"Use the footbridge if the water is high. The reflection works best from the bank just downstream." },
    { name:"Kasbah Tamdaght", img:"a_tamdaght", lat:31.08545, lng:-7.14601, tags:["Hidden gem"], when:"Morning, on your way out or as a short detour.",
      blurb:"A crumbling Glaoui kasbah 6 km up the Ounila valley, with storks nesting on its towers. Almost nobody stops. It shows what Aït Benhaddou looked like before restoration.",
      tip:"Combine with the Ounila road if you arrive from Telouet." }
  ],
  eat:[
    { name:"Chez Moussa", img:"r_moussa", cap:"Breakfast on the terrace, facing the ksar", lat:31.0457, lng:-7.1306, approx:true, tags:["Sunset","View"], when:"Dinner at dusk, stay for the stars.",
      blurb:"A terrace with a full view of the ksar. Tagines and vegetable dishes made with care, and an owner who dims the lights so you can watch the stars come out over the walls.",
      tip:"Ask for the front row of the terrace." },
    { name:"Restaurant Tighramte", img:"r_tighramte", cap:"Mint tea on the terrace, facing the ksar", lat:31.0455, lng:-7.1294, approx:true, tags:["Lunch","Family-run"], when:"Lunch after the ksar.",
      blurb:"Family-run, with two terraces and one of the best views of the ksar, away from the bustle. Generous portions and honest prices, with no surprises on the bill.",
      tip:"Order before you visit the ksar; they cook fresh and it takes about 30 minutes." },
    { name:"La Terrazza", img:"r_terrazza", cap:"Camels below the ksar (illustrative)", lat:31.04447, lng:-7.12948, tags:["Coffee"], when:"Morning espresso, or when you want a break from tagine.",
      blurb:"Italian-run, just uphill from the river in the new village. Real espresso, pizza and pasta, with the old city across the valley.",
      tip:"The best coffee you will find until Marrakech." }
  ],
  local:[{t:"Ounila river",lat:31.0560,lng:-7.1365},{t:"Old ksar",lat:31.0485,lng:-7.1345},{t:"New village",lat:31.0440,lng:-7.1260}]
},
{ id:"dades", img:"d_dades", n:3, r:30, side:"t", name:"Boumalne Dadès", ar:"بومالن دادس", nights:"Nights 4–5", area:"Dades Gorge",
  lede:"Two nights means one full day with no long drive: up the gorge in the morning, a long lunch above the switchbacks, a walk among the Monkey Fingers in the afternoon.",
  stay:{ name:"Sahara Stars Dades", img:"s_dades", cap:"The Dadès valley at Boumalne (illustrative)", lat:31.39219, lng:-5.99248, tags:["Your stay","Pool"],
    blurb:"A riad-style hotel in the Jida district at the edge of Boumalne, about 13 minutes on foot from the start of the gorge. Outdoor pool, garden, terrace, a bar-lounge and two restaurants.",
    when:"Early breakfast on your gorge day.",
    tip:"Ask for breakfast at 7:30 on day 5 and leave by 8:30: the gorge road is quiet and the light is soft on the cliffs.",
    q:"Riad Sahara Stars Dades Boumalne" },
  see:[
    { name:"Tissadrine switchbacks", img:"t_switch", lat:31.5255, lng:-5.9268, approx:true, tags:["TikTok favourite","Iconic"], when:"Before 10:00 or late afternoon.",
      blurb:"About 27 km up the gorge, where the canyon is too narrow for a road, the tarmac climbs out in a stack of hairpins. It is one of the most photographed roads in Morocco, and too tight for tour coaches.",
      tip:"Drive up through the bends, then shoot them from the Timzzillite terrace at the top." },
    { name:"Monkey Fingers", img:"t_monkey", lat:31.44937, lng:-5.96721, tags:["Walk"], when:"Afternoon, when the rock glows.",
      blurb:"Rounded rock towers that look like knuckles, carved out of an ancient riverbed. A guided canyon loop between Aït Arbi and Aït Ouglif squeezes through narrow passages and climbs to a view over the gorge.",
      tip:"Hire a local guide at the trailhead. The canyon has a few scrambles and they know the line." },
    { name:"The poster kasbahs", img:"t_poster", cap:"A Dadès valley kasbah (illustrative)", lat:31.4230, lng:-5.9800, approx:true, tags:["Hidden gem"], when:"Golden hour on the way back down.",
      blurb:"About 6.5 km into the gorge, the red-and-white kasbahs against the rock are the exact scene on Morocco's old Art Deco tourism posters. Stop on the roadside and it's all there.",
      tip:"Shoot from the river side with the poplars in front." },
    { name:"Gorge de Miguirne", img:"t_miguirne", cap:"A narrow Dadès side gorge (illustrative)", lat:31.43898, lng:-5.99297, approx:true, tags:["Hidden gem"], when:"Half-day walk, morning.",
      blurb:"Over a small pass about 14 km from Boumalne, a narrow side gorge joins the Dadès from the south. Few people know it. A quiet walk between almond terraces and sheer walls.",
      tip:"The auberges at km 14 can point you to the start of the path." }
  ],
  eat:[
    { name:"Timzzillite", img:"r_timz", cap:"The switchbacks below the terrace", lat:31.52968, lng:-5.92523, tags:["Lunch","View"], when:"Lunch, timed with the switchbacks.",
      blurb:"A café-restaurant perched at the top of the gorge, directly above the hairpins. The food is simple; the terrace has the best view in the valley.",
      tip:"Park, order mint tea first and take your photos while it's poured." },
    { name:"Chez Pierre", img:"r_pierre", cap:"Tagine pots (illustrative)", lat:31.51146, lng:-5.93673, tags:["Dinner"], when:"Your second evening.",
      blurb:"Mediterranean cooking with market-fresh Moroccan produce, on a menu that changes every day. A whimsical inn in the gorge, known locally for its kitchen.",
      tip:"Book in the morning; they plan the menu around the reservations." },
    { name:"Le Jardin de Source", img:"r_source", cap:"The Dadès river below the rock formations", lat:31.43894, lng:-6.01472, approx:true, tags:["Lunch","Garden"], when:"Slow lunch near the mouth of the gorge.",
      blurb:"A garden restaurant by the river with good vegetarian dishes, omelettes and vegetable tagines under fruit trees.",
      tip:"Good for a light lunch on arrival day." }
  ],
  local:[{t:"Dadès river",lat:31.4100,lng:-5.9930},{t:"Boumalne",lat:31.3700,lng:-5.9780}]
},
{ id:"ergchebbi", img:"d_erg", n:4, r:20, side:"l", name:"Erg Chebbi", ar:"عرق الشبي", nights:"Night 6", area:"Merzouga",
  lede:"A sea of dunes up to 150 m high and about 22 km long. Ride in by camel in the late afternoon, sleep in the sand, and get up for sunrise from the high dune.",
  stay:{ name:"Madu Luxury Camp", img:"s_erg", cap:"A Berber camp in Erg Chebbi (illustrative)", lat:31.1250, lng:-3.9860, approx:true, tags:["Your stay","8 tents"],
    blurb:"The desert camp of Riad Madu in Hassilabied. Eight Berber tents in the dunes, each with a king, queen or twin bed and its own small terrace, about an hour's camel ride in from the riad.",
    when:"Check-in 14:00–16:30, so you are in the sand for sunset.",
    tip:"Leave your big bags at Riad Madu and take a soft overnight bag. Nights are cold from November to March; ask for extra blankets.",
    q:"Madu Luxury Desert Camp Merzouga" },
  see:[
    { name:"Sunrise on the Grande Dune", img:"e_sunrise", lat:31.07774, lng:-3.99235, tags:["Iconic"], when:"Before dawn; ask the camp team to guide you up.",
      blurb:"The climb is slow, two steps up and one back. The reward: the shadow line of the dunes running west towards the Atlas as the sun comes up over Algeria.",
      tip:"Walk along the ridges, not up the faces. Barefoot is easier than shoes." },
    { name:"Khamlia", img:"e_khamlia", lat:31.03512, lng:-4.00725, tags:["Hidden gem","Music"], when:"Afternoon before the camel ride.",
      blurb:"A village of desert Berbers and descendants of people brought from sub-Saharan Africa. Their Gnawa music, iron castanets and drums, began as a song of exile. Families play for visitors in their houses.",
      tip:"Leave a contribution after the music; it is how the families make a living." },
    { name:"Dayet Srij", img:"e_srij", lat:31.09583, lng:-4.05397, tags:["Seasonal"], when:"Only after rain; ask at Riad Madu.",
      blurb:"A seasonal lake on the edge of the dunes. After a wet spell it fills, and flamingos and migrating birds arrive. Some years it is just a dry crust.",
      tip:"Your driver will know if there's water this week." },
    { name:"The night sky", img:"e_night", lat:31.1290, lng:-3.9810, approx:true, tags:["Dark sky"], when:"After the camp fire dies down.",
      blurb:"No town lights to the east for hundreds of kilometres. On a moonless night the Milky Way is bright enough to cast shadows on the sand.",
      tip:"Check the moon phase when you plan; a full moon washes out the stars but lights the dunes silver." }
  ],
  eat:[
    { name:"Riad Madu", img:"r_madu", cap:"Palms and dunes at Merzouga (illustrative)", lat:31.14779, lng:-4.03282, tags:["Lunch","Architecture"], when:"Lunch on arrival, before the camel ride.",
      blurb:"The parent riad in Hassilabied, admired for its architecture and its pool that faces straight onto the dunes. Quieter than Merzouga village.",
      tip:"Ask for lunch by the pool." },
    { name:"Chez Youssef", img:"r_youssef", cap:"Madfouna near Merzouga", lat:31.10004, lng:-4.00793, tags:["Local favourite"], when:"Lunch the next day; it takes time.",
      blurb:"A small café known for madfouna, the stuffed 'Berber pizza', cooked fresh from produce bought next door. Everything is made to order.",
      tip:"Order and go for a walk. An hour's wait is normal and worth it." },
    { name:"Café Restaurant Alla", img:"r_alla", cap:"Gnawa musicians of Khamlia", lat:31.0360, lng:-4.0060, approx:true, tags:["Music"], when:"Combine with Khamlia.",
      blurb:"A family restaurant in Khamlia serving couscous and madfouna made in front of you, with the village musicians playing nearby.",
      tip:"Try the spiced Berber coffee after lunch." }
  ],
  local:[{t:"Hassilabied",lat:31.1520,lng:-4.0390},{t:"Merzouga",lat:31.0980,lng:-4.0200},{t:"Erg Chebbi",lat:31.1700,lng:-3.9700}]
},
{ id:"ouarzazate", img:"d_ouarz", n:5, r:15, side:"b", name:"Ouarzazate", ar:"ورزازات", nights:"Night 7", area:"Ouarzazate",
  lede:"You sleep 12 km outside town in the Fint oasis, a green fold of palms and running water under black rock. Ouarzazate itself is for one morning: the kasbahs and the film studios.",
  stay:{ name:"La Terrasse des Délices", img:"s_ouarz", cap:"The Fint oasis (illustrative)", lat:30.8215, lng:-6.9480, approx:true, tags:["Your stay","Oasis"],
    blurb:"An auberge in Douar Taharbilte in the Fint oasis. A set of small terraces and salons, a pool, and a panoramic terrace over the palms. The kitchen cooks traditional southern Moroccan dishes.",
    when:"Dinner on the panoramic terrace.",
    tip:"Arrive before dark. The last kilometres into Fint are narrow; ask the auberge to send directions or meet you in Ouarzazate.",
    q:"La Terrasse des Delices Oasis de Fint" },
  see:[
    { name:"Walk the Fint oasis", img:"o_fint", lat:30.8180, lng:-6.9520, approx:true, tags:["Hidden gem"], when:"Late afternoon, then sunset from the rim.",
      blurb:"A hidden valley of date palms, gardens and a shallow river, ringed by dark stony plateau. The contrast between the green floor and the black rock is unlike anything else on this trip.",
      tip:"Follow the irrigation channels upstream; locals will happily point the way." },
    { name:"Kasbah Taourirt", img:"o_taourirt", lat:30.92012, lng:-6.89944, tags:["Iconic"], when:"8:00 opening (open until 18:30).",
      blurb:"The Glaoui family's great kasbah, restored with UNESCO help in the 1990s. Inside are the painted ceilings and stucco of the family's private rooms; outside it has been a backdrop for Gladiator and Prince of Persia.",
      tip:"Entry is about 20 dirhams. Look for the painted ceiling in the upper reception rooms." },
    { name:"Kasbah Tifoultoute", img:"o_tifoultoute", lat:30.92659, lng:-6.99042, tags:["Views"], when:"On the way back towards Marrakech.",
      blurb:"A hilltop kasbah from the 17th century, later extended by the Glaoui, standing above the river with the Atlas behind.",
      tip:"Best seen from the river side for the full silhouette." },
    { name:"Atlas Film Studios", img:"o_studios", lat:30.94178, lng:-6.96691, tags:["Fun"], when:"An hour in the morning.",
      blurb:"The first 'Ouarzawood' studio, opened in 1983. Walk through sets and props from films shot in the desert here: Egyptian temples, a Tibetan monastery, Jerusalem gates.",
      tip:"Take the guided tour; the guides tell which star stood where." }
  ],
  eat:[
    { name:"Jardin des Arômes", img:"r_aromes", cap:"Moroccan salads (illustrative)", lat:30.92024, lng:-6.91542, tags:["Dinner","Romantic"], when:"Dinner if you go into town.",
      blurb:"A lounge restaurant in a lush garden on Avenue Mohammed V. Intimate corners, warm lighting and creative Moroccan-Mediterranean cooking.",
      tip:"Ask for a table deep in the garden." },
    { name:"La Kasbah des Sables", img:"r_sables", cap:"Brass lanterns (illustrative)", lat:30.92452, lng:-6.87839, tags:["Gastronomic"], when:"Long lunch after Taourirt.",

const destMarkers=[],groups={},roadGroups={},markerOf=new Map();
DEST.forEach(d=>{
  destMarkers.push(mk(pinEl("dest",d.name,d.n,()=>openDest(d.id),IMG(d.img),{marrakech:"t",aitbenhaddou:"l",dades:"t",ergchebbi:"t",ouarzazate:""}[d.id]),d.stay.lat,d.stay.lng));
  const add=(item,kind,i)=>{item.kind=kind;item.dest=d;item.idx=i;const m=mk(pinEl(kind,item.name,i+1,()=>openDetail(item)),item.lat,item.lng);markerOf.set(item,m);return m;};
  groups[d.id]=[add(d.stay,"stay",0),...d.see.map((x,i)=>add(x,"see",i)),...d.eat.map((x,i)=>add(x,"eat",i))];
  roadGroups[d.id]=LEGS[d.id].stops.map((x,i)=>{x.leg=LEGS[d.id];return add(x,"road",i);});
});
/* every pin is always on the map; zoom decides which kind you see */
[...destMarkers,...Object.values(groups).flat(),...Object.values(roadGroups).flat()].forEach(m=>m.addTo(map));
function zoomCls(){const z=map.getZoom(),c=map.getContainer();c.classList.toggle("far",z<10.5);c.classList.toggle("vfar",z<8);}
map.on("zoom",zoomCls);zoomCls();
function showLayers(){}

/* sheet + camera */
const sheet=document.getElementById("sheet"),body=document.getElementById("body"),grab=document.getElementById("grab");
const DET={low:.3,mid:.56,high:.9};let det="mid";
function sheetPx(d){return d==="low"?150:Math.round(window.innerHeight*DET[d]);}
function setDet(d){det=d;if(!isDesk())sheet.style.height=sheetPx(d)+"px";}
function pads(){
  if(isDesk()) return {top:70,left:sheet.offsetWidth+48,right:80,bottom:40};
  return {top:110,left:28,right:70,bottom:sheetPx(det)+24};
}
const boundsOf=(pts)=>pts.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(pts[0],pts[0]));
function fly(bounds,maxZoom,extra){const p=pads();if(extra){p.left+=extra;p.right+=extra;}map.fitBounds(bounds,{padding:p,maxZoom:maxZoom||16,duration:reduce?0:1500,essential:true});}
function flyPoint(lat,lng,z){map.flyTo({center:[lng,lat],zoom:z,padding:pads(),duration:reduce?0:1200,essential:true});}
const routeBounds=boundsOf(Object.values(LEGS).flatMap(l=>l.path.map(P)));
const legBounds=(leg)=>boundsOf(leg.path.map(P));
const destBounds=(d)=>{const c=new maplibregl.LngLat(d.stay.lng,d.stay.lat);return boundsOf([d.stay,...d.see,...d.eat].filter(i=>c.distanceTo(new maplibregl.LngLat(i.lng,i.lat))<=d.r*1000).map(i=>[i.lng,i.lat]));};
const syncH=()=>document.documentElement.style.setProperty("--sheet-h",isDesk()?"0px":sheet.offsetHeight+"px");
new ResizeObserver(syncH).observe(sheet);

/* drag the sheet between three heights */
(function(){let y0=0,h0=0,drag=false,moved=false;
  grab.addEventListener("pointerdown",e=>{if(isDesk())return;drag=true;moved=false;y0=e.clientY;h0=sheet.offsetHeight;sheet.classList.add("dragging");grab.setPointerCapture(e.pointerId);});
  grab.addEventListener("pointermove",e=>{if(!drag)return;const dy=y0-e.clientY;if(Math.abs(dy)>4)moved=true;sheet.style.height=Math.max(120,Math.min(innerHeight*.94,h0+dy))+"px";});
  const end=()=>{if(!drag)return;drag=false;sheet.classList.remove("dragging");
    if(!moved){setDet(det==="low"?"mid":det==="mid"?"high":"low");return;}
    const r=sheet.offsetHeight/innerHeight;const best=Object.entries(DET).sort((a,b)=>Math.abs(a[1]-r)-Math.abs(b[1]-r))[0][0];setDet(best);};
  grab.addEventListener("pointerup",end);grab.addEventListener("pointercancel",end);
  grab.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();setDet(det==="high"?"mid":"high");}});
})();

/* ======================= VIEWS ======================= */
const state={mode:"overview",dest:null,tab:"stay",detail:null};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CHEV='<svg class="chev" viewBox="0 0 9 14"><path d="M1.5 1.5 7 7l-5.5 5.5"/></svg>';
const BACK='<svg viewBox="0 0 11 18"><path d="M9 2 2 9l7 7"/></svg>';
const X='<svg viewBox="0 0 14 14"><path d="M2 2l10 10M12 2 2 12"/></svg>';
const chips=t=>(t||[]).map(x=>`<span class="chip ${/TikTok|Iconic/.test(x)?"hot":/Hidden/.test(x)?"gem":""}">${esc(x)}</span>`).join("");
function credit(k,cap){const p=PHOTOS[k];if(!p)return "";
  if(p.own)return `<p class="credit" id="gcap">${p.a?(cap?esc(cap)+" · ":"")+"Photos: "+esc(p.a):esc(cap||"")}</p>`;
  return `<p class="credit">${cap?esc(cap)+" · ":""}Photo: <a href="https://commons.wikimedia.org/wiki/${p.f}" target="_blank" rel="noopener">${esc(p.a)}</a>, ${esc(p.l)}</p>`;}
function setActive(item){document.querySelectorAll(".pin.on").forEach(e=>e.classList.remove("on"));
  if(item){const el=markerOf.get(item)?.getElement()?.querySelector(".pin");el&&el.classList.add("on");}}

const DAYS=[
  {day:"Days 1–2",id:"marrakech",title:"Marrakech",sub:"Arrive · Riad Imilchil · 2 nights"},
  {day:"Day 3",id:"aitbenhaddou",title:"Aït Benhaddou",sub:"Over the High Atlas via Telouet · ≈200 km"},
  {day:"Days 4–5",id:"dades",title:"Boumalne Dadès",sub:"Skoura and the Valley of Roses · ≈150 km"},
  {day:"Day 6",id:"ergchebbi",title:"Erg Chebbi",sub:"Todra Gorge, then into the dunes · ≈260 km"},
  {day:"Day 7",id:"ouarzazate",title:"Fint oasis, Ouarzazate",sub:"Back by N'Kob and the Draa · ≈370 km"},
  {day:"Day 8",id:"marrakech",road:true,title:"Back to Marrakech",sub:"Over the Tizi n'Tichka · ≈200 km"}];

function renderOverview(){
  body.innerHTML=`
   <div class="large"><h1>Maroc Bridges</h1><p>Seven nights from Marrakech over the High Atlas to the Sahara and back. Every place chosen for how it looks and feels.</p></div>
   <div class="stats"><div class="stat"><b>7</b><span>nights</span></div><div class="stat"><b>1,180</b><span>km</span></div><div class="stat"><b>2,260</b><span>m pass</span></div><div class="stat"><b>150</b><span>m dunes</span></div></div>
   <h2 class="sect">Chapters</h2>
   <div class="carousel">${DEST.map(d=>`<button class="card" data-dest="${d.id}"><img src="${IMG(d.img)}" alt="" loading="lazy"><span class="shade"></span><span class="num">${d.nights}</span><span class="ct"><b>${d.name}</b><span>${esc(d.stay.name)}</span></span></button>`).join("")}</div>
   <h2 class="sect">Day by day</h2>
   <ul class="group">${DAYS.map((x,i)=>{const d=DEST.find(z=>z.id===x.id);const img=x.road?LEGS.marrakech.stops[0].img:d.img;
     return `<li><button class="row" data-i="${i}"><span class="thumb"><img src="${IMG(img)}" alt="" loading="lazy"></span><span class="rt"><em>${x.day}</em><b>${esc(x.title)}</b><span>${esc(x.sub)}</span></span>${CHEV}</button></li>`}).join("")}</ul>
   <p class="foot">Photos from Wikimedia Commons, credited on each place; some show the setting rather than the exact venue and are marked “illustrative”. Map data © OpenStreetMap contributors, © OpenMapTiles. Most pins come from OpenStreetMap; ones marked approximate were placed by hand. Opening hours and prices change, so confirm before you go.</p>`;
  body.querySelectorAll("[data-dest]").forEach(b=>b.onclick=()=>openDest(b.dataset.dest));
  body.querySelectorAll(".row[data-i]").forEach(b=>b.onclick=()=>{const x=DAYS[+b.dataset.i];openDest(x.id,x.road?"road":"stay");});
}
function rowHTML(it,kind,i){const badge=kind==="stay"?"":`<i class="c-${kind}">${i+1}</i>`;
  return `<li><button class="row" data-k="${kind}" data-i="${i}"><span class="thumb"><img src="${IMG(it.img)}" alt="" loading="lazy">${badge}</span><span class="rt"><b>${esc(it.name)}</b><span>${esc(it.when)}</span></span>${CHEV}</button></li>`;}
function renderDest(){
  const d=DEST.find(x=>x.id===state.dest),leg=LEGS[d.id];
  const tabs=[["stay","Stay","--stay"],["see","See","--see"],["eat","Eat","--eat"],["road","Road","--road"]];
  let list="";
  if(state.tab==="stay") list=`<ul class="group">${rowHTML(d.stay,"stay",0)}</ul>`;
  if(state.tab==="see") list=`<ul class="group">${d.see.map((x,i)=>rowHTML(x,"see",i)).join("")}</ul>`;
  if(state.tab==="eat") list=`<ul class="group">${d.eat.map((x,i)=>rowHTML(x,"eat",i)).join("")}</ul>`;
  if(state.tab==="road") list=`<p class="note"><b style="color:var(--ink)">${leg.title}</b> · from ${leg.from} · ${leg.meta}</p><ul class="group">${leg.stops.map((x,i)=>rowHTML(x,"road",i)).join("")}</ul>`;
  body.innerHTML=`
   <div class="nav"><button class="back" id="toAll">${BACK}Journey</button></div>
   <figure class="hero"><img src="${IMG(d.img)}" alt=""><span class="shade"></span><div class="ht"><p class="kicker">Chapter ${d.n} · ${d.nights}</p><h1>${d.name}<span class="ar" lang="ar">${d.ar}</span></h1></div></figure>
   ${credit(d.img)}
   <p class="lede">${esc(d.lede)}</p>
   <div class="seg" role="tablist">${tabs.map(([k,l,c])=>`<button role="tab" aria-selected="${state.tab===k}" data-tab="${k}"><span class="dot" style="background:var(${c})"></span>${l}</button>`).join("")}</div>
   ${list}`;
  body.querySelector("#toAll").onclick=showOverview;
  body.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;const st=body.scrollTop;renderDest();body.scrollTop=st;
    state.tab==="road"?fly(legBounds(leg),12):fly(destBounds(d),16);});
  body.querySelectorAll(".row[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k,i=+b.dataset.i;openDetail(k==="stay"?d.stay:k==="road"?leg.stops[i]:d[k][i]);});
}
const ICON_CLOCK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
const ICON_STAR='<svg viewBox="0 0 24 24"><path d="M12 3.5l2.3 5.6 6 .5-4.6 3.9 1.4 5.9L12 16.3 6.9 19.4l1.4-5.9L3.7 9.6l6-.5z"/></svg>';
function renderDetail(it){
  const d=it.dest,kindName={stay:"Your stay",see:"See",eat:"Eat",road:"On the road"}[it.kind];
  const where=it.kind==="road"?it.leg.title:d.name;
  const q=encodeURIComponent(it.q||`${it.name}, ${it.kind==="road"?"Morocco":d.area+", Morocco"}`);
  const tt=encodeURIComponent(`${it.name} ${it.kind==="road"?"Morocco":d.name}`);
  const color={stay:"--stay",see:"--see",eat:"--eat",road:"--road"}[it.kind];
  body.innerHTML=`
   <figure class="dhero"><div class="gal" id="gal">${(it.gallery||[it.img]).map(k=>`<img src="${IMG(k)}" alt="">`).join("")}</div>${(it.gallery||[]).length>1?`<div class="gdots">${it.gallery.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`:""}<button class="xbtn" id="closeDetail" aria-label="Close and return to the map">${X}</button></figure>
   ${credit(it.img,it.gcaps?it.gcaps[0]:it.cap)}
   <div class="dt"><p class="kicker" style="color:var(${color})">${kindName}${it.kind==="stay"?"":" · "+(it.idx+1)} · ${esc(where)}</p><h1>${esc(it.name)}</h1><div class="chips">${chips(it.tags)}</div></div>
   <p class="prose">${esc(it.blurb)}</p>
   <ul class="info"><li><span class="ib" style="background:var(${color})">${ICON_CLOCK}</span><div><b>When to go</b><p>${esc(it.when)}</p></div></li>
     <li><span class="ib" style="background:#B8892B">${ICON_STAR}</span><div><b>Insider tip</b><p>${esc(it.tip)}</p></div></li></ul>
   <div class="actions">
     <a class="btn primary" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M3 11 21 3l-8 18-2-8z"/></svg>Directions</a>
     <a class="btn" href="https://www.tiktok.com/search?q=${tt}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>TikTok</a>
   </div>
   ${it.approx?'<p class="foot">Pin placed approximately.</p>':""}`;
  body.querySelector("#closeDetail").onclick=closeDetail;
  const g=body.querySelector("#gal"),dots=body.querySelectorAll(".gdots i");
  if(g&&dots.length)g.addEventListener("scroll",()=>{const i=Math.round(g.scrollLeft/g.clientWidth);dots.forEach((d,j)=>d.classList.toggle("on",i===j));const gc=body.querySelector("#gcap");if(gc&&it.gcaps&&it.gcaps[i])gc.textContent=it.gcaps[i];},{passive:true});
}

const later=fn=>setTimeout(fn,isDesk()?30:400);
function showOverview(){
  state.mode="overview";state.dest=null;state.detail=null;setActive(null);
  renderOverview();body.scrollTop=0;setDet("mid");later(()=>fly(routeBounds,9,40));
}
function openDest(id,tab){
  state.mode="dest";state.dest=id;state.tab=tab||"stay";state.detail=null;setActive(null);
  renderDest();body.scrollTop=0;setDet("mid");
  const d=DEST.find(x=>x.id===id);later(()=>state.tab==="road"?fly(legBounds(LEGS[id]),12):fly(destBounds(d),16));
}
function openDetail(item){
  if(state.mode==="dest"){state.dest=item.dest.id;state.tab=item.kind;}
  state.detail=item;renderDetail(item);body.scrollTop=0;setDet("mid");setActive(item);
  later(()=>{setActive(item);const z=map.getZoom();flyPoint(item.lat,item.lng,item.kind==="road"?Math.min(Math.max(z,11.5),13):Math.min(Math.max(z,14.5),15.5));});
}
/* one tap: card away, map free, everything still on it */
function closeDetail(){
  state.detail=null;setActive(null);
  if(state.mode==="dest")renderDest();else renderOverview();
  body.scrollTop=0;setDet("low");
}
map.on("click",e=>{const t=e.originalEvent&&e.originalEvent.target;if(t&&t.closest&&t.closest(".mk"))return;
  if(state.detail)closeDetail();else setDet("low");});
document.getElementById("zoomOut").onclick=()=>{if(state.detail){state.detail=null;setActive(null);}
  state.mode="overview";state.dest=null;renderOverview();body.scrollTop=0;setDet("low");later(()=>fly(routeBounds,9,40));};
document.getElementById("zin").onclick=()=>map.zoomIn();
document.getElementById("zout").onclick=()=>map.zoomOut();
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(state.detail)closeDetail();else if(state.mode==="dest")showOverview();}});
addEventListener("resize",()=>{if(!isDesk())sheet.style.height=sheetPx(det)+"px";else sheet.style.height="";});

/* opening: all of Morocco, then glide onto the loop */
renderOverview();setDet("mid");
map.fitBounds([[-13.2,27.7],[-1.0,35.9]],{padding:pads(),duration:0});
map.once("idle",()=>setTimeout(()=>{if(state.mode==="overview")fly(routeBounds,9,40);},reduce?0:500));
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
